name: Testes E2E Cypress

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  cypress:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Limpar resultados anteriores
        run: npm run report:clean
      - run: npx cypress run
      - if: always()
        run: npm run report:merge && npm run report:generate
      - if: always()
        name: Publicar resumo detalhado no GitHub Actions
        run: node scripts/resumo-relatorio.js
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-cypress
          path: |
            cypress/relatorios
            cypress/resultados
            cypress/screenshots
          if-no-files-found: warn
